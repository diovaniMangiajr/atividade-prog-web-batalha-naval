<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha Naval - GAC116</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Folha de estilo personalizada -->
    <link rel="stylesheet" href="code/css/styles.css">
</head>
<body class="bg-light">

    <!-- Cabeçalho semântico -->
    <header class="bg-primary text-white py-3 shadow-sm mb-4 text-center">
        <h1 class="h2 mb-1">Batalha Naval</h1>
        <p class="mb-0 small">Destrua a frota inimiga antes que afundem seus navios</p>
    </header>

    <!-- Conteúdo principal -->
    <main class="container">
        
        <!-- Painel de status e instruções -->
        <section class="row justify-content-center mb-4">
            <div class="col-12 col-md-8 text-center">
                <div class="alert alert-info py-2" role="alert">
                    <span id="status" class="fw-bold">Aguardando início da partida...</span>
                </div>
            </div>
        </section>

        <!-- Área dos Tabuleiros -->
        <section class="row g-4 justify-content-center">
            
            <!-- Tabuleiro do Jogador -->
            <div class="col-12 col-md-5 text-center">
                <div class="card shadow-sm p-3">
                    <h2 class="h5 mb-3 text-primary">Sua Frota</h2>
                    <div id="tabuleiro-jogador" class="tabuleiro mx-auto">
                        <!-- As células serão geradas aqui -->
                    </div>
                    <div class="mt-2 text-muted small">
                        Navios restantes: <span id="navios-jogador" class="fw-semibold">0</span>
                    </div>
                </div>
            </div>

            <!-- Painel Central de Controle -->
            <div class="col-12 col-md-2 d-flex flex-column align-items-center justify-content-center gap-3">
                <div class="card p-3 w-100 text-center shadow-sm">
                    <span class="text-muted small">Placar</span>
                    <div class="d-flex justify-content-around fw-bold fs-5 mt-1">
                        <span id="placar-jogador" class="text-primary">0</span>
                        <span>x</span>
                        <span id="placar-computador" class="text-danger">0</span>
                    </div>
                </div>
                <button id="btn-reiniciar" class="btn btn-warning w-100 fw-bold shadow-sm" onclick="reiniciarJogo()">
                    Novo Jogo
                </button>
            </div>

            <!-- Tabuleiro da Máquina -->
            <div class="col-12 col-md-5 text-center">
                <div class="card shadow-sm p-3">
                    <h2 class="h5 mb-3 text-danger">Radar Inimigo</h2>
                    <div id="tabuleiro-computador" class="tabuleiro mx-auto">
                        <!-- As células serão geradas aqui -->
                    </div>
                    <div class="mt-2 text-muted small">
                        Navios restantes: <span id="navios-computador" class="fw-semibold">0</span>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Rodapé semântico -->
    <footer class="bg-white border-top py-3 mt-5 text-center text-muted small">
        <p class="mb-1"><b>Disciplina:</b> GAC116 - Programação Web</p>
        <p class="mb-0">&copy; 2026</p>
    </footer>

    <!-- Script JS -->
    <script src="code/js/script.js"></script>
</body>
</html>
